<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedLib — Bibliothèque médicale numérique</title>
<style>
:root{--blue:#1457d9;--navy:#0b1f3a;--ink:#142033;--muted:#6b7890;--bg:#f5f8fc;--card:#fff;--line:#e4eaf2;--green:#0f9d73;--red:#d9485f;--gold:#d9a441;--shadow:0 14px 40px rgba(15,35,65,.08);--r:18px}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;color:var(--navy);cursor:pointer}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1457d9,#0b1f3a);color:white;display:grid;place-items:center;font-weight:900}.nav{display:flex;gap:8px;align-items:center}.nav button,.ghost{border:0;background:transparent;padding:10px 13px;color:#526077;font-weight:700;border-radius:10px}.nav button:hover,.ghost:hover{background:#eef4ff;color:var(--blue)}.primary{background:var(--blue)!important;color:#fff!important;border:0;padding:11px 17px;border-radius:11px;font-weight:800;box-shadow:0 7px 20px rgba(20,87,217,.18)}.secondary{background:#edf3ff;color:var(--blue);border:0;padding:11px 17px;border-radius:11px;font-weight:800}.danger{background:#fff0f2;color:var(--red);border:0;padding:10px 14px;border-radius:10px;font-weight:800}.page{max-width:1180px;margin:auto;padding:34px 20px 70px}.hero{padding:65px 0 45px;display:grid;grid-template-columns:1.15fr .85fr;gap:42px;align-items:center}.eyebrow{color:var(--blue);font-weight:900;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.hero h1{font-size:54px;line-height:1.04;margin:12px 0 18px;color:var(--navy)}.hero p{font-size:18px;line-height:1.7;color:var(--muted);max-width:650px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.hero-card{background:linear-gradient(150deg,#0b1f3a,#123e78);border-radius:28px;padding:30px;color:white;box-shadow:var(--shadow);min-height:340px;position:relative;overflow:hidden}.hero-card:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08);right:-70px;top:-70px}.hero-card h3{font-size:26px;margin:0 0 25px}.book{background:#fff;color:var(--navy);border-radius:15px;padding:20px;width:78%;box-shadow:0 20px 45px rgba(0,0,0,.22);transform:rotate(-4deg)}.book .cover{height:130px;border-radius:10px;background:linear-gradient(140deg,#dceaff,#fff);display:flex;align-items:end;padding:18px;font-weight:900;font-size:19px}.section-title{display:flex;justify-content:space-between;align-items:end;margin:42px 0 20px}.section-title h2{margin:0;font-size:29px;color:var(--navy)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 6px 22px rgba(15,35,65,.04);overflow:hidden}.card-body{padding:19px}.course-cover{height:155px;background:linear-gradient(145deg,#eaf2ff,#d9e8ff);padding:18px;display:flex;justify-content:space-between;align-items:start}.tag{display:inline-flex;padding:6px 9px;border-radius:999px;background:#eef3fb;color:#526077;font-size:11px;font-weight:900}.premium{background:#fff4dc;color:#946b16}.free{background:#e8f8f1;color:#087a59}.course-title{font-size:18px;font-weight:900;line-height:1.25;margin:10px 0}.meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}.card-actions{display:flex;gap:8px;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:white;border:1px solid var(--line);padding:20px;border-radius:16px}.stat b{font-size:28px;color:var(--navy);display:block}.stat span{font-size:13px;color:var(--muted)}.searchbar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;display:grid;grid-template-columns:1fr 180px 150px;gap:10px;margin:18px 0}.searchbar input,.searchbar select,.form input,.form select{width:100%;border:1px solid var(--line);background:#fbfcfe;padding:12px 13px;border-radius:11px;outline:none}.searchbar input:focus,.form input:focus{border-color:#8bb1ff;box-shadow:0 0 0 3px #e8f0ff}.detail{display:grid;grid-template-columns:320px 1fr;gap:28px}.detail-cover{min-height:390px;border-radius:22px;background:linear-gradient(150deg,#dfeaff,#f9fbff);padding:25px;display:flex;align-items:end}.detail-info h1{font-size:39px;margin:8px 0 14px;color:var(--navy)}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px}.reader{background:#152033;min-height:70vh;border-radius:20px;padding:25px;color:#fff}.readerbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.pdfpage{background:white;color:#1e293b;max-width:760px;min-height:850px;margin:auto;padding:55px;border-radius:5px;box-shadow:0 12px 30px rgba(0,0,0,.2)}.pdfpage h1{color:var(--navy)}.pdfpage h2{color:var(--blue)}.line{height:9px;background:#edf1f6;border-radius:8px;margin:12px 0}.line.short{width:70%}.formbox{max-width:480px;margin:35px auto;background:#fff;padding:30px;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.formbox h1{margin-top:0;color:var(--navy)}.form label{display:block;font-weight:800;font-size:13px;margin:15px 0 7px}.form .primary{width:100%;margin-top:20px}.notice{padding:13px 15px;border-radius:12px;background:#eef5ff;color:#234e9b;font-size:14px}.success{background:#e9f8f2;color:#087a59}.error{background:#fff0f2;color:#a92c43}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 13px;font-weight:800;color:#5d6b80}.tab.active{background:#eaf1ff;color:var(--blue);border-color:#c8d9ff}.pricing{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.price{padding:28px;background:#fff;border:1px solid var(--line);border-radius:20px}.price.featured{border:2px solid var(--blue);box-shadow:var(--shadow);transform:translateY(-5px)}.price h3{margin:0}.amount{font-size:40px;font-weight:950;color:var(--navy);margin:18px 0}.check{padding:8px 0;color:#526077}.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:22px}.side{background:#0b1f3a;color:#dce7f6;border-radius:18px;padding:15px;height:max-content;position:sticky;top:90px}.side button{width:100%;text-align:left;background:transparent;color:#dce7f6;border:0;padding:12px;border-radius:10px;font-weight:800}.side button:hover,.side button.active{background:#18345b}.table{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px}.table th{background:#f8fafd;color:#607087}.footer{background:#0b1f3a;color:#c8d4e4;padding:45px 5%;margin-top:60px}.footer strong{color:#fff}.mobile{display:none}.mobile-menu{display:none!important}.account-links{display:flex;gap:8px;align-items:center}.admin-link{border:1px solid #d7e1ef!important;color:#0b1f3a!important;background:#f8fafd!important}.auth-switch{display:flex;gap:8px;margin:18px 0 4px}.auth-switch button{flex:1}.account-note{margin-top:18px;padding:14px;border:1px solid #dbe5f2;border-radius:13px;background:#f8fafd}.mobile-menu button{width:100%;text-align:left;margin:5px 0}.mobile-menu.open{display:block!important}@media(max-width:850px){.nav{display:none}.mobile{display:block}.mobile-menu{display:block;position:absolute;right:14px;top:64px;width:245px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow);z-index:30}.hero{grid-template-columns:1fr;padding-top:35px}.hero h1{font-size:40px}.grid,.pricing{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.detail{grid-template-columns:1fr}.admin-layout{grid-template-columns:1fr}.side{position:static}.searchbar{grid-template-columns:1fr}.pdfpage{padding:25px;min-height:650px}}@media(max-width:560px){.grid,.pricing{grid-template-columns:1fr}.page{padding:22px 14px 50px}.top{padding:0 14px}.hero-card{min-height:290px}.stats{grid-template-columns:1fr 1fr}.hero p{font-size:16px}.section-title h2{font-size:24px}}
</style></head>
<body><div id="app"></div>
<script>
const courses=[
{id:1,title:'Anatomie générale — Tome 1',cat:'Anatomie',level:'Débutant',pages:184,type:'premium',author:'Dr. M. Kabeya',desc:'Fondamentaux structurés de l’anatomie humaine : plans, régions, appareils et repères indispensables.'},
{id:2,title:'Physiologie humaine — Bases essentielles',cat:'Physiologie',level:'Intermédiaire',pages:212,type:'premium',author:'Pr. A. Ilunga',desc:'Comprendre les grands mécanismes physiologiques avec une progression adaptée aux études médicales.'},
{id:3,title:'Sémiologie médicale',cat:'Sémiologie',level:'Intermédiaire',pages:248,type:'premium',author:'Dr. S. Bingioba',desc:'Démarche clinique, interrogatoire, examen physique et raisonnement sémiologique.'},
{id:4,title:'Introduction à la pharmacologie',cat:'Pharmacologie',level:'Débutant',pages:96,type:'free',author:'MedLib Editorial',desc:'Premiers concepts : pharmacocinétique, pharmacodynamie et sécurité médicamenteuse.'},
{id:5,title:'Cardiologie — Insuffisance cardiaque',cat:'Cardiologie',level:'Avancé',pages:132,type:'premium',author:'Pr. Médical',desc:'Approche structurée de l’insuffisance cardiaque, clinique, physiopathologie et prise en charge.'},
{id:6,title:'Pathologie respiratoire',cat:'Pneumologie',level:'Intermédiaire',pages:156,type:'premium',author:'MedLib Editorial',desc:'Syndromes respiratoires, exploration et principales pathologies pulmonaires.'},
{id:7,title:'Biochimie médicale — Métabolisme',cat:'Biochimie',level:'Intermédiaire',pages:171,type:'premium',author:'Dr. N. Tshibangu',desc:'Métabolisme glucidique, lipidique, protéique et applications cliniques.'},
{id:8,title:'Immunologie — Fiches fondamentales',cat:'Immunologie',level:'Débutant',pages:74,type:'free',author:'MedLib Editorial',desc:'Cellules, organes lymphoïdes, immunité innée et adaptative.'}
];
const cats=['Toutes','Anatomie','Physiologie','Sémiologie','Pharmacologie','Cardiologie','Pneumologie','Biochimie','Immunologie'];
let state={route:'home',user:null,query:'',cat:'Toutes',type:'Tous',adminTab:'overview',message:''};
function load(){try{state.user=JSON.parse(localStorage.getItem('medlib_user')||'null')}catch{};render()}
function saveUser(){localStorage.setItem('medlib_user',JSON.stringify(state.user));}
function closeMobileMenu(){const m=document.getElementById('mobileMenu');if(m)m.classList.remove('open')}
function go(r){closeMobileMenu();state.route=r;state.message='';render();scrollTo(0,0)}
function toggleMobile(){const m=document.getElementById('mobileMenu');if(m)m.classList.toggle('open')}
function nav(){let logged=state.user;return `<header class="top"><div class="brand" onclick="go('home')"><div class="logo">M</div>MedLib</div><nav class="nav"><button onclick="go('home')">Accueil</button><button onclick="go('library')">Bibliothèque</button><button onclick="go('pricing')">Tarifs</button>${logged?`<button onclick="go('${logged.role==='admin'?'admin':'dashboard'}')">${logged.role==='admin'?'Administration':'Mon espace'}</button><button class="primary" onclick="logout()">Déconnexion</button>`:`<button onclick="go('login')">Connexion</button><button class="primary" onclick="go('register')">Créer un compte</button><button class="admin-link" onclick="go('login')">Administration</button>`}</nav><button class="mobile primary" aria-label="Ouvrir le menu de navigation" aria-expanded="false" onclick="toggleMobile()">☰ Menu</button><div id="mobileMenu" class="mobile-menu"><button class="ghost" onclick="go('home')">🏠 Accueil</button><button class="ghost" onclick="go('library')">📚 Bibliothèque</button><button class="ghost" onclick="go('pricing')">💳 Tarifs</button>${logged?`<button class="ghost" onclick="go('${logged.role==='admin'?'admin':'dashboard'}')">${logged.role==='admin'?'🧑‍💼 Administration':'🎓 Mon espace'}</button><button class="danger" onclick="logout()">Déconnexion</button>`:`<button class="ghost" onclick="go('login')">🔑 Se connecter</button><button class="primary" onclick="go('register')">✚ Créer un compte étudiant</button><button class="ghost admin-link" onclick="go('login')">🧑‍💼 Accès administrateur</button>`}</div></header>`}
function footer(){return `<footer class="footer"><div style="max-width:1180px;margin:auto"><strong>MedLib</strong><p>Bibliothèque médicale numérique pensée pour les étudiants et professionnels de santé francophones.</p><small>© 2026 MedLib · Démonstration avant mise en production</small></div></footer>`}
function card(c){return `<article class="card"><div class="course-cover"><span class="tag ${c.type==='premium'?'premium':'free'}">${c.type==='premium'?'PREMIUM':'GRATUIT'}</span><span class="tag">PDF</span></div><div class="card-body"><div class="meta">${c.cat} · ${c.level}</div><div class="course-title">${c.title}</div><div class="meta">${c.pages} pages · ${c.author}</div><p class="muted" style="line-height:1.5;font-size:14px">${c.desc}</p><div class="card-actions"><button class="secondary" onclick="go('course-${c.id}')">Voir le cours</button>${c.type==='free'?`<button class="primary" onclick="go('reader-${c.id}')">Lire</button>`:`<button class="primary" onclick="${state.user&&state.user.subscription?'go(\'reader-'+c.id+'\')':'go(\'pricing\')'}">${state.user&&state.user.subscription?'Lire':'Débloquer'}</button>`}</div></div></article>`}
function home(){return `<main><div class="page"><section class="hero"><div><div class="eyebrow">La bibliothèque médicale nouvelle génération</div><h1>Apprendre la médecine. <span style="color:var(--blue)">Plus simplement.</span></h1><p>Une bibliothèque numérique centralisée pour trouver, lire et organiser vos cours médicaux depuis votre téléphone, tablette ou ordinateur.</p><div class="actions"><button class="primary" onclick="go('library')">Explorer la bibliothèque</button><button class="secondary" onclick="go('pricing')">Voir les abonnements</button></div><div class="meta" style="margin-top:20px">✓ Cours PDF · ✓ Lecture en ligne · ✓ Suivi de progression</div></div><div class="hero-card"><h3>Votre bibliothèque médicale</h3><div class="book"><div class="cover">ANATOMIE<br>HUMAINE<br><small>MedLib</small></div><div style="padding-top:14px;font-weight:800">184 pages · PDF premium</div></div></div></section><div class="stats"><div class="stat"><b>8+</b><span>Cours disponibles</span></div><div class="stat"><b>6</b><span>Disciplines</span></div><div class="stat"><b>24/7</b><span>Accès numérique</span></div><div class="stat"><b>1</b><span>Bibliothèque centralisée</span></div></div><section><div class="section-title"><h2>Cours à découvrir</h2><button class="ghost" onclick="go('library')">Voir tout →</button></div><div class="grid">${courses.slice(0,3).map(card).join('')}</div></section><section><div class="section-title"><h2>Comment ça marche ?</h2></div><div class="grid"><div class="panel"><b>01 · Créez votre compte</b><p class="muted">Inscription rapide et espace personnel.</p></div><div class="panel"><b>02 · Choisissez votre formule</b><p class="muted">Accédez au catalogue premium avec un abonnement actif.</p></div><div class="panel"><b>03 · Étudiez partout</b><p class="muted">Lecture en ligne, favoris, historique et reprise de lecture.</p></div></div></section></div></main>${footer()}`}
function library(){let list=courses.filter(c=>(state.cat==='Toutes'||c.cat===state.cat)&&(state.type==='Tous'||c.type===state.type)&&((c.title+' '+c.cat+' '+c.desc).toLowerCase().includes(state.query.toLowerCase())));return `<main class="page"><div class="eyebrow">Catalogue</div><h1 style="font-size:40px;color:var(--navy)">Bibliothèque médicale</h1><p class="muted">Recherchez un cours, choisissez une discipline et commencez votre révision.</p><div class="searchbar"><input placeholder="Rechercher un cours..." value="${state.query}" oninput="state.query=this.value;render()"><select onchange="state.cat=this.value;render()">${cats.map(x=>`<option ${x===state.cat?'selected':''}>${x}</option>`).join('')}</select><select onchange="state.type=this.value;render()"><option>Tous</option><option ${state.type==='free'?'selected':''} value="free">Gratuit</option><option ${state.type==='premium'?'selected':''} value="premium">Premium</option></select></div><div class="tabs">${cats.map(x=>`<button class="tab ${x===state.cat?'active':''}" onclick="state.cat='${x}';render()">${x}</button>`).join('')}</div><div class="grid">${list.length?list.map(card).join(''):`<div class="panel" style="grid-column:1/-1">Aucun cours ne correspond à votre recherche.</div>`}</div></main>`}
function course(id){let c=courses.find(x=>x.id===+id);if(!c)return home();let unlocked=c.type==='free'||(state.user&&state.user.subscription);return `<main class="page"><button class="ghost" onclick="go('library')">← Retour à la bibliothèque</button><div class="detail" style="margin-top:20px"><div class="detail-cover"><div><span class="tag ${c.type==='premium'?'premium':'free'}">${c.type==='premium'?'PREMIUM':'GRATUIT'}</span><h2 style="font-size:28px">${c.cat}</h2><p class="muted">Support PDF · ${c.pages} pages</p></div></div><div class="detail-info"><div class="meta">${c.cat} · ${c.level} · ${c.pages} pages</div><h1>${c.title}</h1><p class="muted" style="font-size:17px;line-height:1.7">${c.desc}</p><div class="panel"><b>À propos du cours</b><p class="muted">Ce support est organisé pour faciliter la compréhension, la révision et la reprise rapide des notions essentielles.</p><div class="meta">Auteur : ${c.author} · Langue : Français · Format : PDF</div></div><div class="actions">${unlocked?`<button class="primary" onclick="go('reader-${c.id}')">📖 Lire le cours</button>`:`<button class="primary" onclick="go('pricing')">🔒 S'abonner pour lire</button>`}<button class="secondary" onclick="favorite(${c.id})">♡ Ajouter aux favoris</button></div>${!unlocked?`<div class="notice" style="margin-top:16px">Ce cours est réservé aux abonnés. Votre abonnement donne accès aux contenus premium pendant sa durée de validité.</div>`:''}</div></div></main>`}
function auth(kind){return `<main class="page"><div class="formbox"><div class="eyebrow">${kind==='login'?'Accès MedLib':'Inscription MedLib'}</div><h1>${kind==='login'?'Bienvenue sur MedLib':'Créer votre compte'}</h1><p class="muted">${kind==='login'?'Connectez-vous à votre espace étudiant ou administrateur.':'Créez gratuitement votre compte étudiant pour commencer.'}</p><div class="auth-switch"><button class="${kind==='login'?'primary':'secondary'}" onclick="go('login')">🔑 Connexion</button><button class="${kind==='register'?'primary':'secondary'}" onclick="go('register')">✚ Créer un compte</button></div>${state.message?`<div class="notice ${state.message.includes('incorrect')?'error':'success'}">${state.message}</div>`:''}<form class="form" onsubmit="event.preventDefault();${kind==='login'?'login()':'register()'}">${kind==='register'?`<label>Nom complet</label><input id="name" required placeholder="Ex. Sosthene Bingioba">`:''}<label>Adresse e-mail</label><input id="email" type="email" required placeholder="vous@exemple.com"><label>Mot de passe</label><input id="password" type="password" minlength="6" required placeholder="Au moins 6 caractères"><button class="primary" type="submit">${kind==='login'?'Se connecter':'Créer mon compte étudiant'}</button></form><div class="account-note"><b>🧑‍💼 Administrateur</b><p class="muted" style="margin:7px 0">L’administrateur utilise le même écran de connexion avec son compte administrateur. Aucun visiteur ne peut créer un compte admin.</p><button class="ghost admin-link" onclick="go('login')">Accès administrateur →</button></div><div class="notice" style="margin-top:18px"><b>Comptes de démonstration</b><br>Étudiant : <b>etudiant@medlib.demo</b> / <b>123456</b><br>Admin : <b>admin@medlib.demo</b> / <b>admin123</b></div></div></main>`}
function login(){let e=document.getElementById('email').value.trim(),p=document.getElementById('password').value; if(e==='admin@medlib.demo'&&p==='admin123')state.user={name:'Administrateur MedLib',email:e,role:'admin',subscription:true};else if(e==='etudiant@medlib.demo'&&p==='123456')state.user={name:'Étudiant MedLib',email:e,role:'student',subscription:true,plan:'6 mois'};else {state.message='Identifiants incorrects pour la démonstration.';render();return}saveUser();go(state.user.role==='admin'?'admin':'dashboard')}
function register(){let n=document.getElementById('name').value.trim(),e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;if(n.length<2||!e||p.length<6){state.message='Veuillez remplir correctement tous les champs. Le mot de passe doit contenir au moins 6 caractères.';render();return}state.user={name:n,email:e,role:'student',subscription:false};saveUser();state.message='Compte étudiant créé avec succès.';go('dashboard')}
function logout(){state.user=null;localStorage.removeItem('medlib_user');state.message='';go('home')}
function pricing(){let plans=[['Mensuel','$5','30 jours'],['6 mois','$25','180 jours'],['Annuel','$45','365 jours']];return `<main class="page"><div style="text-align:center;max-width:700px;margin:30px auto"><div class="eyebrow">Abonnement</div><h1 style="font-size:42px;color:var(--navy)">Accédez à toute la bibliothèque premium</h1><p class="muted">Choisissez une formule adaptée à votre rythme d’étude. Ceci est un environnement de démonstration avant intégration du paiement réel.</p></div><div class="pricing">${plans.map((p,i)=>`<div class="price ${i===1?'featured':''}"><span class="tag ${i===1?'premium':''}">${i===1?'RECOMMANDÉ':'ACCÈS PREMIUM'}</span><h3 style="margin-top:15px">${p[0]}</h3><div class="amount">${p[1]}</div><div class="muted">${p[2]}</div><div style="margin:20px 0"><div class="check">✓ Tous les cours premium</div><div class="check">✓ Lecture PDF en ligne</div><div class="check">✓ Favoris et historique</div><div class="check">✓ Reprise de lecture</div></div><button class="primary" style="width:100%" onclick="subscribe('${p[0]}')">Choisir cette formule</button></div>`).join('')}</div></main>`}
function subscribe(plan){if(!state.user){go('login');return}state.user.subscription=true;state.user.plan=plan;saveUser();state.message='Votre abonnement de démonstration est actif.';go('dashboard')}
function dashboard(){if(!state.user)return go('login');let recent=courses.slice(0,3);return `<main class="page"><div class="section-title"><div><div class="eyebrow">Espace étudiant</div><h2>Bonjour, ${state.user.name.split(' ')[0]} 👋</h2><p class="muted">Votre espace personnel de révision.</p></div><button class="primary" onclick="go('library')">Explorer les cours</button></div><div class="stats"><div class="stat"><b>${state.user.subscription?'Actif':'—'}</b><span>Abonnement</span></div><div class="stat"><b>3</b><span>Cours commencés</span></div><div class="stat"><b>42%</b><span>Progression moyenne</span></div><div class="stat"><b>5</b><span>Favoris</span></div></div><div class="section-title"><h2>Continuer la lecture</h2></div><div class="grid">${recent.map((c,i)=>`<div class="card"><div class="card-body"><div class="meta">${c.cat}</div><div class="course-title">${c.title}</div><div class="meta">Progression : ${[42,18,76][i]}%</div><div style="height:8px;background:#e9eef5;border-radius:8px;margin:14px 0"><div style="height:100%;width:${[42,18,76][i]}%;background:var(--blue);border-radius:8px"></div></div><button class="primary" onclick="go('reader-${c.id}')">Reprendre</button></div></div>`).join('')}</div><div class="grid" style="margin-top:20px"><div class="panel"><b>Mon abonnement</b><p class="muted">${state.user.subscription?'Formule '+(state.user.plan||'premium')+' · accès actif':'Aucun abonnement actif'}</p><button class="secondary" onclick="go('pricing')">Gérer l’abonnement</button></div><div class="panel"><b>Mes favoris</b><p class="muted">5 cours enregistrés pour les retrouver rapidement.</p><button class="secondary" onclick="go('library')">Voir la bibliothèque</button></div><div class="panel"><b>Mon profil</b><p class="muted">${state.user.email}</p><button class="secondary" onclick="state.route='profile';render()">Gérer le profil</button></div></div></main>`}
function reader(id){let c=courses.find(x=>x.id===+id);if(!c)return go('library');if(c.type==='premium'&&(!state.user||!state.user.subscription))return go('pricing');return `<main class="page"><div class="reader"><div class="readerbar"><div><b>MedLib Reader</b><div style="opacity:.7;font-size:13px">${c.title}</div></div><button class="secondary" onclick="go('dashboard')">Quitter</button></div><div class="pdfpage"><div class="eyebrow">MEDLIB · COURS PDF</div><h1>${c.title}</h1><p><b>${c.author}</b> · ${c.pages} pages</p><hr><h2>Objectifs pédagogiques</h2><p>À la fin de ce chapitre, l’étudiant doit pouvoir identifier les notions essentielles, les relier entre elles et les mobiliser dans un raisonnement clinique.</p><div class="line"></div><div class="line"></div><div class="line short"></div><h2>Introduction</h2><p>Cette page représente le lecteur PDF sécurisé de démonstration. En production, le contenu réel sera servi depuis un stockage privé et accessible uniquement aux utilisateurs autorisés.</p><div class="panel"><b>Page 1 / ${c.pages}</b><div class="meta" style="margin-top:8px">Progression enregistrée automatiquement · Recherche · Zoom · Plein écran · Reprise de lecture</div></div></div></div></main>`}
function profile(){if(!state.user)return go('login');return `<main class="page"><div class="formbox"><div class="eyebrow">Mon profil</div><h1>Informations personnelles</h1><div class="form"><label>Nom complet</label><input value="${state.user.name}" disabled><label>E-mail</label><input value="${state.user.email}" disabled><label>Rôle</label><input value="${state.user.role}" disabled><button class="primary" onclick="go('dashboard')">Retour à mon espace</button></div></div></main>`}
function admin(){if(!state.user||state.user.role!=='admin')return go('login');let tab=state.adminTab;return `<main class="page"><div class="admin-layout"><aside class="side"><b style="display:block;padding:12px 12px 20px;font-size:19px">MedLib Admin</b>${[['overview','Vue générale'],['courses','Cours'],['categories','Catégories'],['users','Utilisateurs'],['subscriptions','Abonnements'],['payments','Paiements'],['statistics','Statistiques']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="state.adminTab='${x[0]}';render()">${x[1]}</button>`).join('')}<button style="margin-top:15px" onclick="logout()">Déconnexion</button></aside><section><div class="section-title"><div><div class="eyebrow">Administration</div><h2>${tab==='overview'?'Tableau de bord':tab==='courses'?'Gestion des cours':tab==='categories'?'Catégories':tab==='users'?'Utilisateurs':tab==='subscriptions'?'Abonnements':tab==='payments'?'Paiements':'Statistiques'}</h2></div><button class="primary" onclick="state.message='Action de démonstration';render()">+ Ajouter</button></div>${state.message?`<div class="notice success">${state.message}</div>`:''}${adminContent(tab)}</section></div></main>`}
function adminContent(t){if(t==='overview')return `<div class="stats"><div class="stat"><b>1 284</b><span>Utilisateurs</span></div><div class="stat"><b>428</b><span>Abonnés actifs</span></div><div class="stat"><b>68</b><span>Cours publiés</span></div><div class="stat"><b>$8 940</b><span>Revenus</span></div></div><div class="grid" style="margin-top:20px"><div class="panel"><b>Activité récente</b><p class="muted">12 nouvelles inscriptions aujourd’hui</p><p class="muted">7 abonnements activés</p><p class="muted">4 cours mis à jour</p></div><div class="panel"><b>État de la plateforme</b><p class="success" style="padding:10px;border-radius:9px">Tous les services opérationnels</p></div></div>`;if(t==='courses')return `<div class="table"><table><tr><th>Cours</th><th>Discipline</th><th>Accès</th><th>Pages</th><th>Statut</th></tr>${courses.map(c=>`<tr><td><b>${c.title}</b></td><td>${c.cat}</td><td>${c.type}</td><td>${c.pages}</td><td><span class="tag free">Publié</span></td></tr>`).join('')}</table></div>`;if(t==='categories')return `<div class="grid">${cats.slice(1).map((c,i)=>`<div class="panel"><b>${c}</b><p class="muted">${[12,9,15,8,11,7,10,6][i]||5} cours</p></div>`).join('')}</div>`;if(t==='users')return `<div class="table"><table><tr><th>Utilisateur</th><th>E-mail</th><th>Rôle</th><th>Statut</th></tr><tr><td>Étudiant MedLib</td><td>etudiant@medlib.demo</td><td>student</td><td>Actif</td></tr><tr><td>Administrateur MedLib</td><td>admin@medlib.demo</td><td>admin</td><td>Actif</td></tr></table></div>`;if(t==='subscriptions')return `<div class="table"><table><tr><th>Client</th><th>Formule</th><th>État</th><th>Expiration</th></tr><tr><td>Étudiant MedLib</td><td>6 mois</td><td>Actif</td><td>31/03/2027</td></tr><tr><td>Utilisateur #1024</td><td>Annuel</td><td>Actif</td><td>14/08/2027</td></tr></table></div>`;if(t==='payments')return `<div class="table"><table><tr><th>Référence</th><th>Montant</th><th>Fournisseur</th><th>État</th></tr><tr><td>ML-2026-00182</td><td>$25</td><td>Payment Gateway</td><td>Succès</td></tr><tr><td>ML-2026-00181</td><td>$5</td><td>Payment Gateway</td><td>Succès</td></tr></table></div>`;return `<div class="grid"><div class="panel"><b>Abonnements</b><h2>428</h2><p class="muted">+12,4% ce mois</p></div><div class="panel"><b>Lectures PDF</b><h2>8 492</h2><p class="muted">+18,1% ce mois</p></div><div class="panel"><b>Revenus</b><h2>$8 940</h2><p class="muted">Chiffre d’affaires de démonstration</p></div></div>`}
function favorite(id){state.message='Cours ajouté à vos favoris (démonstration).';render()}
function render(){let r=state.route;let content=r==='home'?home():r==='library'?library():r==='pricing'?pricing():r==='login'?auth('login'):r==='register'?auth('register'):r==='dashboard'?dashboard():r==='profile'?profile():r==='admin'?admin():r.startsWith('course-')?course(r.split('-')[1]):r.startsWith('reader-')?reader(r.split('-')[1]):home();document.getElementById('app').innerHTML=nav()+content}
load();
</script></body></html>
